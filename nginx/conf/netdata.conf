# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name __DOMAIN__;

    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log;

    auth_basic           "Netdata";
    auth_basic_user_file /etc/nginx/.htpasswd-netdata;

    location / {
        proxy_pass __UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN__;

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}
