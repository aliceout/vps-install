<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Recharge tout seul : quand l'upstream est de nouveau up, la page revient. -->
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex, nofollow">
<title>Service indisponible</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  .panel {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8vw; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #d6ffd6;
    user-select: none; -webkit-user-select: none;
    background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(0,0,0,.78) 0%, rgba(0,0,0,0) 70%);
  }
  .code {
    font-size: .8rem; letter-spacing: .12em;
    color: #00ff66; border: 1px solid rgba(0,255,102,.4);
    border-radius: 999px; padding: 4px 12px; margin-bottom: 1.5rem;
    text-shadow: 0 0 6px rgba(0,255,102,.5);
  }
  h1 {
    font-size: clamp(1.3rem, 4.2vw, 2.6rem); font-weight: 500; line-height: 1.3;
    text-shadow: 0 0 10px rgba(0,255,102,.55), 0 2px 6px rgba(0,0,0,.9);
    min-height: 1.3em;
  }
  .sub { margin-top: 1rem; color: #9affb0; font-size: clamp(.9rem, 2.6vw, 1.15rem); }
  .hint { margin-top: 1.75rem; font-size: .8rem; color: #4caf6a; }
  .dud { color: #00aa44; opacity: .75; }
  @media (prefers-reduced-motion: reduce) {
    #matrix { display: none; }
    .panel { background: none; }
  }
</style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="panel">
    <div class="code">ERREUR <!--#echo var="status" --></div>
    <h1 id="title">La matrice redémarre</h1>
    <div class="sub">Merci de patienter</div>
    <p class="hint">Tentative de reconnexion automatique dans 30 secondes</p>
  </div>
<script>
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // ----- Pluie Matrix -----
  var canvas = document.getElementById('matrix'), ctx = canvas.getContext('2d');
  var chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾚﾛﾜﾝ0123456789ABCDEFZ:.="*+-<>'.split('');
  var fontSize = 16, columns, drops;
  function reset() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize); drops = [];
    for (var i = 0; i < columns; i++) drops[i] = Math.floor(Math.random() * -canvas.height / fontSize);
  }
  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px ui-monospace, Menlo, Consolas, monospace';
    for (var i = 0; i < drops.length; i++) {
      ctx.fillStyle = Math.random() > 0.975 ? '#d6ffd6' : '#00ff66';
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  var last = 0;
  (function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < 80) return; last = now; draw();
  })(0);
  reset();
  window.addEventListener('resize', reset);

  // ----- Decodage sequentiel : titre -> sous-titre -> hint (l'un apres l'autre) -----
  var SCRAMBLE = '!<>-_\\/[]{}=+*^?#0123ｱｦﾐﾑﾒｷｸｹ'.split('');
  function decode(el, done, onHalf) {
    var target = el.getAttribute('data-txt'), queue = [], maxEnd = 0;
    for (var i = 0; i < target.length; i++) {
      var s = Math.floor(Math.random() * 75), e = s + 50 + Math.floor(Math.random() * 100);
      if (e > maxEnd) maxEnd = e;
      queue.push({ to: target[i], start: s, end: e, ch: '' });
    }
    var frame = 0, half = false;
    (function upd() {
      var out = '', d = 0;
      for (var i = 0; i < queue.length; i++) {
        var q = queue[i];
        if (frame >= q.end) { d++; out += q.to; }
        else if (frame >= q.start) {
          if (!q.ch || Math.random() < 0.28) q.ch = SCRAMBLE[Math.floor(Math.random() * SCRAMBLE.length)];
          out += '<span class="dud">' + q.ch + '</span>';
        } else { out += (q.to === ' ' ? ' ' : ''); }
      }
      el.innerHTML = out;
      if (!half && frame >= maxEnd / 2) { half = true; if (onHalf) onHalf(); }
      if (d === queue.length) { if (done) done(); return; }
      frame++; requestAnimationFrame(upd);
    })();
  }
  // On blanchit les lignes, puis : titre + sous-titre ensemble, et le hint
  // une fois ces deux-la termines.
  var lines = [document.getElementById('title'),
               document.querySelector('.sub'),
               document.querySelector('.hint')];
  lines.forEach(function (el) { el.setAttribute('data-txt', el.textContent); el.textContent = ''; });
  var n = 0;
  function pairHalf() { if (++n === 2) decode(lines[2]); }
  decode(lines[0], null, pairHalf);
  decode(lines[1], null, pairHalf);
})();
</script>
</body>
</html>
