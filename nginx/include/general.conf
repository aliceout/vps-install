# Map websocket connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# gzip (safe-ish) - "gzip on" est deja pose par /etc/nginx/nginx.conf par defaut
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# Rate limit zone pour le receiver webhooks (anti-flood). L'auth HMAC bloque
# deja le declenchement abusif, mais pas le DoS au niveau parsing/scan FS.
limit_req_zone $binary_remote_addr zone=webhook_limit:1m rate=5r/s;