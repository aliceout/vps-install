# Basique “++” sans casser trop de choses
server_tokens off;

# Limites soft
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# Buffers headers : permet de gerer les requetes avec gros cookies / JWT /
# auth bearer sans renvoyer 414 "Request-URI Too Large".
# 4k = taille typique du 1er buffer, 8 x 16k = jusqu'a 128k de headers.
client_header_buffer_size 4k;
large_client_header_buffers 8 16k;

# Note: pas de `client_max_body_size` ici - directive non-dupliquable au meme
# niveau, donc chaque service la met a sa valeur (defaut nginx = 1m).

# HSTS : 2 ans, force HTTPS, inclut les sous-domaines
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# (optionnel) anti clickjacking / sniffing / referrer
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy: volontairement pas agressif
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;