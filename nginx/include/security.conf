# Basique “++” sans casser trop de choses
server_tokens off;

# Limites soft
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# Note: pas de `client_max_body_size` ici - directive non-dupliquable au meme
# niveau, donc chaque service la met a sa valeur (defaut nginx = 1m).

# HSTS : 2 ans, force HTTPS, inclut les sous-domaines
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# (optionnel) anti clickjacking / sniffing / referrer
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy: volontairement pas agressif
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;