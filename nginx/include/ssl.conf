# Mozilla “intermediate”-style
ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3: pas besoin de definir ssl_ciphers.
# TLS 1.2: ciphers modernes (une seule ligne sinon OpenSSL refuse la liste).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling : OFF.
# Let's Encrypt a arrete les OCSP responders avec les certs E8+ (mai 2025).
# Avec ssl_stapling on, nginx spam un warning par cert a chaque reload sans
# qu'aucun stapling ne soit fait. Off = silencieux + comportement identique.
ssl_stapling off;

# Resolver utilise par d'eventuels proxy_pass avec hostname variable (et qui
# servait aussi a OCSP avant). On le garde, ca ne coute rien.
resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
resolver_timeout 5s;