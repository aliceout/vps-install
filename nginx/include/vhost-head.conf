# Brique commune pour TOUT vhost HTTPS de service :
# listen 443 + http2, protocols/ciphers TLS, headers de securite,
# headers additionnels (optionnels par service).
# A inclure en tete de chaque server block 443.
listen 443 ssl;
listen [::]:443 ssl;
http2 on;

include /etc/nginx/include/ssl.conf;
include /etc/nginx/include/security.conf;
include /etc/nginx/include/headers.conf;

# Page custom pour 502/503/504 (upstream Docker en cours de redemarrage,
# timeout, ou unhealthy). Le 'internal' empeche l'acces direct au fichier.
error_page 502 503 504 /__nginx_50x.html;
location = /__nginx_50x.html {
    root /etc/nginx/include;
    internal;
}
