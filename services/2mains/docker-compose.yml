# 2mains de femmes : site Astro statique + backend formulaire de contact.
# Variables substituees au runtime depuis /var/lib/services/2mains/runtime.env :
#   - PORT_SITE, PORT_MAIL, SERVICE_NAME (cloud Infisical + install.sh)
#   - SMTP_*, MAIL_TO, RATE_LIMIT_PER_HOUR, ALLOWED_ORIGIN (self-hosted Infisical,
#     fetchees a l'install/update et au webhook deploy).

services:
  site:
    image: ghcr.io/aliceout/2mains-site:latest
    container_name: ${SERVICE_NAME}-site
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${PORT_SITE}:80"

  mail:
    image: ghcr.io/aliceout/2mains-mail:latest
    container_name: ${SERVICE_NAME}-mail
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${PORT_MAIL}:3000"
    env_file:
      # SMTP_*, MAIL_TO, etc. fetched from self-hosted Infisical (env.backlice.dev,
      # projet 2mains) par install.sh / hook.sh -> ecrit ici.
      - /var/lib/services/2mains/runtime.env
