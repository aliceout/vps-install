# 2mains de femmes : site Astro statique + backend formulaire de contact.
# Variables substituees au runtime depuis l'env du shell qui invoque docker
# compose (PORT_SITE, PORT_MAIL, SERVICE_NAME source par install.sh / hook.sh
# depuis /etc/secrets/2mains.env).

services:
  site:
    image: ghcr.io/aliceout/2mains-site:latest
    container_name: ${SERVICE_NAME}-site
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${PORT_SITE}:80"

  mail:
    image: ghcr.io/aliceout/2mains-mail:latest
    container_name: ${SERVICE_NAME}-mail
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${PORT_MAIL}:3000"
    env_file:
      # SMTP_*, MAIL_TO, RATE_LIMIT_PER_HOUR, ALLOWED_ORIGIN viennent du
      # cloud Infisical via l'agent. Le container Node ignore les cles
      # qu'il n'utilise pas (PORT_*, ADRESS, DNS_*, etc.).
      - /etc/secrets/2mains.env
