server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monservice.mondomaine.fr;

    # Cert WILDCARD partage pour tout le domaine (apex = mondomaine.fr),
    # obtenu par certbot-wildcard au moment de l'install du service.
    ssl_certificate     /etc/letsencrypt/live/mondomaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mondomaine.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mondomaine.fr/chain.pem;

    include /etc/nginx/include/ssl.conf;
    include /etc/nginx/include/security.conf;
    include /etc/nginx/include/headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/include/proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name monservice.mondomaine.fr;
    return 301 https://$host$request_uri;
}
