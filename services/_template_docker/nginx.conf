server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __ADRESS__;

    # Cert WILDCARD sur __DOMAIN__ (obtenu par certbot-wildcard a l'install).
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    include /etc/nginx/include/ssl.conf;
    include /etc/nginx/include/security.conf;
    include /etc/nginx/include/headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/include/proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __ADRESS__;
    return 301 https://$host$request_uri;
}
