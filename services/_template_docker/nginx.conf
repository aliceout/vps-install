server {
    listen 443 ssl http2;
    server_name monservice.mondomaine.fr;

    include /etc/nginx/include/ssl.conf;
    include /etc/nginx/include/security.conf;
    include /etc/nginx/include/headers.conf;

    ssl_certificate     /etc/letsencrypt/live/monservice.mondomaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monservice.mondomaine.fr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/include/proxy.conf;
    }
}

server {
    listen 80;
    server_name monservice.mondomaine.fr;
    return 301 https://$host$request_uri;
}
