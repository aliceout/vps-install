<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>alyss</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  /* Respecte les utilisateurs qui coupent les animations : fond noir fixe. */
  @media (prefers-reduced-motion: reduce) {
    #matrix { display: none; }
  }
</style>
</head>
<body>
  <canvas id="matrix"></canvas>
<script>
(function () {
  var canvas = document.getElementById('matrix');
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = canvas.getContext('2d');

  // Jeu de caracteres facon cmatrix : katakana + chiffres + quelques latins.
  var chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾚﾛﾜﾝ0123456789ABCDEFZ:.="*+-<>'.split('');

  var fontSize = 16, columns, drops;

  function reset() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = [];
    for (var i = 0; i < columns; i++) {
      // Depart aleatoire en hauteur pour eviter une 1re ligne synchronisee.
      drops[i] = Math.floor(Math.random() * -canvas.height / fontSize);
    }
  }

  function draw() {
    // Voile noir semi-transparent : laisse une trainee derriere chaque goutte.
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + 'px ui-monospace, Menlo, Consolas, monospace';

    for (var i = 0; i < drops.length; i++) {
      var text = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;

      // Tete de colonne plus claire, queue en vert classique.
      ctx.fillStyle = Math.random() > 0.975 ? '#d6ffd6' : '#00ff66';
      ctx.fillText(text, x, y);

      if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  var last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    // ~30 fps : suffisant pour l'effet, doux pour le CPU.
    if (now - last < 33) return;
    last = now;
    draw();
  }

  reset();
  window.addEventListener('resize', reset);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
