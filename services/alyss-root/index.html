<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>alyss</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05060a; overflow: hidden; }
  body {
    display: flex;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #9fd8ff; /* cyan, assorti a la figure */
  }

  /* Gauche 1/3 : zone de texte, fond transparent (laisse voir le fond de page) */
  .left {
    flex: 0 0 33.333%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6vh 4vw;
    background: transparent;
  }
  .left h1 { font-size: clamp(1.6rem, 3vw, 2.6rem); font-weight: 500; margin-bottom: 1rem; color: #bfe6ff; }
  .left p  { color: #7fb8da; line-height: 1.6; font-size: clamp(.9rem, 1.4vw, 1.05rem); }

  /* Droite 2/3 : animation */
  .right { flex: 1; position: relative; }
  .right canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Bouton son (autoplay bloque par les navigateurs -> clic requis) */
  #snd {
    position: fixed; top: 18px; left: 18px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,.45); color: #9fd8ff;
    border: 1px solid rgba(159,216,255,.4);
    font-size: 16px; cursor: pointer; line-height: 1;
    backdrop-filter: blur(4px);
  }
  #snd:hover { color: #d6f0ff; border-color: #d6f0ff; }

  /* Crédits discrets */
  .credits {
    position: fixed; bottom: 14px; left: 16px; z-index: 20;
    font-size: 11px; line-height: 1.5; text-align: left;
    color: rgba(159,216,255,.45);
  }
  .credits a { color: inherit; }

  /* Mobile : on empile (texte en haut, anim en bas) */
  @media (max-width: 700px) {
    body { flex-direction: column; }
    .left { flex: 0 0 auto; padding: 4vh 6vw; }
    .right { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .right canvas { display: none; } }
</style>
</head>
<body>
  <div class="left">
    <!-- ZONE TEXTE : écris ce que tu veux ici -->
    <p>« Tout vide appelle un maître ; le laisser vide est déjà un combat. »</p>
  </div>
  <div class="right">
    <canvas id="c"></canvas>
  </div>

  <!-- Son ambient (CC0). Fichier servi en local sous ambient.mp3. -->
  <audio id="bgm" src="ambient.mp3" loop preload="none"></audio>
  <button id="snd" type="button" aria-label="Activer/couper le son">&#9835;</button>

  <footer class="credits">
    Musique : John Bartmann — « Nightshift » (CC0)<br>
    Animation : attracteur de Peter de Jong (art génératif)
  </footer>

<script>
  (function () {
    const audio = document.getElementById('bgm'), btn = document.getElementById('snd');
    const sync = function () { btn.textContent = audio.paused ? '♪' : '⏸'; }; // ♪ / ⏸
    audio.addEventListener('play', sync);
    audio.addEventListener('pause', sync);
    const kick = function () { audio.play().catch(function () {}); };
    // Le son ne se charge qu'au 1er geste sur la page (preload=none -> pas de
    // telechargement du mp3 tant qu'on n'interagit pas), hors bouton son.
    function onGesture(e) {
      if (e.target.closest && e.target.closest('#snd')) return;
      kick();
      document.removeEventListener('pointerdown', onGesture);
      document.removeEventListener('keydown', onGesture);
    }
    document.addEventListener('pointerdown', onGesture);
    document.addEventListener('keydown', onGesture);
    // 3) bouton = play/pause manuel
    btn.addEventListener('click', function () { audio.paused ? kick() : audio.pause(); });
    sync();
  })();
</script>
<script>
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('c'), x = c.getContext('2d');
  let W, H, px = 0.1, py = 0.1, t = 0;
  function resize() {
    W = c.width = c.clientWidth; H = c.height = c.clientHeight;
    x.fillStyle = '#05060a'; x.fillRect(0, 0, W, H);
  }
  resize(); addEventListener('resize', resize);
  (function f() {
    requestAnimationFrame(f);
    x.globalCompositeOperation = 'source-over';
    x.fillStyle = 'rgba(5,6,10,0.07)'; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'lighter';
    t += 0.018;
    const a = 1.4 + 0.35 * Math.sin(t * 0.5), b = -2.3 + 0.30 * Math.cos(t * 0.4),
          cc = 2.4 + 0.35 * Math.sin(t * 0.3), d = -2.1 + 0.30 * Math.cos(t * 0.6);
    const sc = Math.min(W, H) / 4.6, cx = W / 2, cy = H / 2;
    for (let i = 0; i < 42000; i++) {
      const nx = Math.sin(a * py) - Math.cos(b * px), ny = Math.sin(cc * px) - Math.cos(d * py);
      px = nx; py = ny;
      const hue = 195 + 45 * Math.sin(t * 0.5 + nx * 0.6);
      x.fillStyle = 'hsla(' + hue + ',90%,65%,0.09)';
      x.fillRect(cx + nx * sc, cy + ny * sc, 1, 1);
    }
  })();
})();
</script>
</body>
</html>
