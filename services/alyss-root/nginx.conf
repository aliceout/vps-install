server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADDRESS__.access.log;
    error_log  /var/log/nginx/__ADDRESS__.error.log;

    # Page statique anonyme : sert uniquement la holding page, ne proxifie rien
    # et ne liste aucun service (sous-domaines servis par leurs propres vhosts).
    root /var/www/alyss-root;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
