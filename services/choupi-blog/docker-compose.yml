# Ghost blog (SQLite single-container).
# Variables substituees depuis /var/lib/services/choupi-blog/runtime.env :
#   - PORT       (cloud Infisical /services/choupi-blog/PORT)
#   - DATA_DIR   (calcule a l'install : /home/<VPS_USER>/data/choupi-blog)
#   - URL        (calcule a l'install : https://<ADDRESS>)
#   - MAIL_*     (self-hosted Infisical /choupi-blog/)

services:
  ghost:
    image: ghost:5-alpine
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT}:2368"
    volumes:
      # Bind mount sur disque, PAS un volume Docker. Inclut themes, images,
      # uploads et ghost.db (SQLite). Backup via /home/<VPS_USER>/data/.
      - ${DATA_DIR}/content:/var/lib/ghost/content
    environment:
      url: ${URL}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      database__useNullAsDefault: "true"
      mail__transport: SMTP
      mail__from: ${MAIL_FROM}
      mail__options__host: ${MAIL_HOST}
      mail__options__port: ${MAIL_PORT}
      mail__options__secure: ${MAIL_SECURE:-false}
      mail__options__auth__user: ${MAIL_USER}
      mail__options__auth__pass: ${MAIL_PASS}
      NODE_ENV: production
