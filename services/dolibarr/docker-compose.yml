# Dolibarr - ERP/CRM self-hosted (PHP + MariaDB). Image officielle Tuxgasy,
# config 100% par env vars. Variables substituees depuis
# /var/lib/services/dolibarr/runtime.env :
#   - SERVICE_NAME, PORT, ADDRESS, DATA_DIR        (injectes par install.sh)
#   - DB_DATABASE, DB_USERNAME, DB_PASSWORD        (Infisical /services/dolibarr/)
#   - ADMIN_LOGIN, ADMIN_PASSWORD                  (1er compte admin Dolibarr)
#   - INSTANCE_UNIQUE_ID                           (SECRET STABLE, cf. note plus bas)
#   - IMAGE_TAG, TZ                                (optionnels)
# Les noms Infisical (DB_DATABASE/DB_USERNAME/DB_PASSWORD) sont remappes ici vers
# les env vars natives de l'image (DOLI_DB_NAME/DOLI_DB_USER/DOLI_DB_PASSWORD).

services:
  db:
    image: mariadb:11
    container_name: ${SERVICE_NAME}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Le user applicatif a tous les droits sur SA base -> Dolibarr cree ses
      # tables (llx_*) sans root. Pas de root password persiste.
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ${DATA_DIR}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # Pinne IMAGE_TAG dans Infisical (ex: 21.0.1) pour un deploy reproductible.
    # Defaut 'latest' = pratique mais suit les majeures sans prevenir.
    image: dolibarr/dolibarr:${IMAGE_TAG:-latest}
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT}:80"
    environment:
      DOLI_DB_TYPE: mysqli
      DOLI_DB_HOST: db
      DOLI_DB_HOST_PORT: "3306"
      DOLI_DB_NAME: ${DB_DATABASE}
      DOLI_DB_USER: ${DB_USERNAME}
      DOLI_DB_PASSWORD: ${DB_PASSWORD}
      # DB + user deja crees par le container mariadb -> on NE passe PAS
      # DOLI_DB_ROOT_LOGIN/PASS, l'image installe juste les tables (pas de root).

      # URL publique : nginx termine le TLS et force http->https au niveau vhost,
      # donc on NE met PAS DOLI_HTTPS=1 (evite une boucle de redirection derriere
      # le proxy). DOLI_URL_ROOT en https suffit pour les liens/PDF generes.
      DOLI_URL_ROOT: https://${ADDRESS}
      DOLI_PROD: "1"

      # CLE CRITIQUE POUR LA PERSISTANCE : conf.php vit dans la couche image
      # (/var/www/html, non persistee) et est regenere depuis les env a chaque
      # boot. Sans INSTANCE_UNIQUE_ID fixe, l'image en tire un aleatoire a chaque
      # redemarrage -> jetons CSRF invalides + donnees chiffrees (mots de passe
      # modules, etc.) illisibles. On le fige via Infisical.
      DOLI_INSTANCE_UNIQUE_ID: ${INSTANCE_UNIQUE_ID}

      # 1er compte admin, cree au 1er install (install.lock dans documents/).
      DOLI_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      DOLI_ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Uploads : aligne avec client_max_body_size 50M cote nginx.
      PHP_INI_UPLOAD_MAX_FILESIZE: 50M
      PHP_INI_POST_MAX_SIZE: 50M
      PHP_INI_MEMORY_LIMIT: 512M
      PHP_INI_DATE_TIMEZONE: ${TZ:-Europe/Paris}
    volumes:
      # documents/ = LA data metier (fichiers, PDF, ECM, install.lock).
      - ${DATA_DIR}/documents:/var/www/documents
      # custom/ = modules externes installes, pour qu'ils survivent aux updates
      # d'image (le reste de /var/www/html reste ephemere = code de l'image).
      - ${DATA_DIR}/custom:/var/www/html/custom
