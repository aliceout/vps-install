TYPE="docker-compose"
DESCRIPTION="Dolibarr - ERP/CRM self-hosted (PHP + MariaDB)"

INFISICAL_PATH="/services/dolibarr"

# Data persistee :
#   - db/        : MariaDB (/var/lib/mysql)
#   - documents/ : /var/www/documents (fichiers joints, PDF generes, ECM, backups)
#   - custom/    : /var/www/html/custom (modules externes installes)
DATA_DIR="/home/$VPS_USER/data/dolibarr"

RESTORE_ON_INSTALL=yes
