# Fider - feedback / votes feature requests open-source (Go binary + Postgres).
# Variables substituees depuis /var/lib/services/fider/runtime.env :
#   - SERVICE_NAME, PORT, ADDRESS, DATA_DIR  (cloud Infisical /services/fider/)
#   - POSTGRES_*, JWT_SECRET, EMAIL_*       (self-hosted Infisical /fider/)

services:
  db:
    image: postgres:16-alpine
    container_name: ${SERVICE_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: getfider/fider:stable
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      # BASE_URL : Fider panic au boot si absent. Doit etre l'URL publique
      # (utilisee dans les magic-links et les notifs mail).
      BASE_URL: https://${ADDRESS}
      # SMTP : indispensable car Fider n'a pas de password classique, login
      # uniquement via magic-link envoye par mail (y compris l'admin).
      EMAIL_NOREPLY: ${EMAIL_NOREPLY}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_SMTP_ENABLE_STARTTLS: ${EMAIL_SMTP_ENABLE_STARTTLS:-true}
