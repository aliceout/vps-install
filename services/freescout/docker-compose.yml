# FreeScout - helpdesk / boite mail partagee (PHP/Laravel + MariaDB).
# Image communautaire nfrastack (ex-tiredofit), config 100% par env vars.
# Variables substituees depuis /var/lib/services/freescout/runtime.env :
#   - SERVICE_NAME, PORT, ADDRESS, DATA_DIR   (injectes par install.sh)
#   - DB_NAME, DB_USER, DB_PASS               (Infisical Cloud /services/freescout/)
#   - ADMIN_EMAIL, ADMIN_PASS                 (Infisical Cloud /services/freescout/)
#   - ADMIN_FIRST_NAME, ADMIN_LAST_NAME, TZ   (optionnels)

services:
  db:
    image: mariadb:11
    container_name: ${SERVICE_NAME}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      # Pas de root password persiste : seul le user applicatif sert. L'entrypoint
      # mariadb chown /var/lib/mysql au boot (run root puis drop vers mysql).
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ${DATA_DIR}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/nfrastack/container-freescout:latest
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT}:80"
    environment:
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # URL publique : derivee d'ADDRESS (pas de cle SITE_URL dediee en Infisical).
      APP_URL: https://${ADDRESS}
      # On est derriere nginx qui termine le TLS : indispensable pour que
      # FreeScout genere des liens https et ne boucle pas en redirect.
      FREESCOUT_APP_PROXY: "true"
      FREESCOUT_APP_TIMEZONE: ${TZ:-Europe/Paris}
      # Compte admin cree au 1er boot (idempotent cote image).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASS: ${ADMIN_PASS}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
    volumes:
      - ${DATA_DIR}/data:/data
      - ${DATA_DIR}/logs:/logs
