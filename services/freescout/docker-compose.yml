# FreeScout - helpdesk / boite mail partagee (PHP/Laravel + MariaDB).
# Image communautaire nfrastack (ex-tiredofit), config 100% par env vars.
# Variables substituees depuis /var/lib/services/freescout/runtime.env :
#   - SERVICE_NAME, PORT, ADDRESS, DATA_DIR        (injectes par install.sh)
#   - DB_DATABASE, DB_USERNAME, DB_PASSWORD        (Infisical Cloud /services/freescout/)
#   - ADMIN_EMAIL, ADMIN_PASSWORD                  (Infisical Cloud /services/freescout/)
#   - APP_KEY                                       (Infisical, stabilite chiffrement Laravel)
#   - ADMIN_FIRST_NAME, ADMIN_LAST_NAME, TZ        (optionnels)
# Les noms Infisical (DB_DATABASE/DB_USERNAME/DB_PASSWORD/ADMIN_PASSWORD) sont
# remappes ici vers les env vars natives de l'image (DB_NAME/DB_USER/DB_PASS/...).

services:
  db:
    image: mariadb:11
    container_name: ${SERVICE_NAME}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Pas de root password persiste : seul le user applicatif sert. L'entrypoint
      # mariadb chown /var/lib/mysql au boot (run root puis drop vers mysql).
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ${DATA_DIR}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/nfrastack/container-freescout:latest
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    pull_policy: always
    # Pas d'egress IPv6 sur ce VPS : freescout.net publie une AAAA, cURL tente
    # l'IPv6 et pend 10s (WpApi timeout, catalogue de modules KO). On coupe
    # l'IPv6 dans le container -> tout passe en IPv4 (qui marche).
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT}:80"
    environment:
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_DATABASE}
      DB_USER: ${DB_USERNAME}
      DB_PASS: ${DB_PASSWORD}
      # Cle Laravel fournie via Infisical : evite une regeneration a chaque
      # redeploy (sinon sessions/donnees chiffrees invalidees).
      APP_KEY: ${APP_KEY:-}
      # URL publique : derivee d'ADDRESS (pas de cle APP_URL/SITE_URL en Infisical).
      # REQUISE par l'init de l'image (40-freescout) : sans elle -> halt -> 502.
      APP_URL: https://${ADDRESS}
      # NE PAS mettre FREESCOUT_APP_PROXY : dans FreeScout APP_PROXY = proxy HTTP
      # *sortant* pour Guzzle (pas le reverse proxy). Une valeur non vide casse
      # tous les appels API (catalogue de modules, licences) -> cURL error 28.
      # Le HTTPS derriere nginx marche via APP_URL=https + les headers X-Forwarded.
      FREESCOUT_APP_TIMEZONE: ${TZ:-Europe/Paris}
      # Sessions en FICHIER (defaut FreeScout). FreeScout ne fournit PAS de
      # migration pour une table `sessions` : si SESSION_DRIVER derive vers
      # `database` (via une maj d'image / un .env persiste), chaque requete
      # plante en "Table 'sessions' doesn't exist" (Whoops). On le fige ici pour
      # que ca ne redérive jamais. Les sessions vivent dans /data/storage
      # (persiste).
      FREESCOUT_SESSION_DRIVER: file
      # Compte admin cree au 1er boot (idempotent cote image).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASS: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
    volumes:
      - ${DATA_DIR}/data:/data
      - ${DATA_DIR}/logs:/logs
