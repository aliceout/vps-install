# FreshRSS - agregateur RSS (image officielle freshrss/freshrss).
# Apache + PHP-FPM internes, expose port 80 du container.
# Variables substituees depuis l'env du shell qui invoque docker compose
# (sourced depuis /etc/secrets/freshrss.env par install.sh / hook).

services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${PORT}:80"
    volumes:
      # Data : config, feeds.db (SQLite par defaut), users, sessions
      - ${DATA_DIR}/data:/var/www/FreshRSS/data
      # Extensions installees a la main par l'admin
      - ${DATA_DIR}/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Refresh des feeds : default toutes les 20 min
      CRON_MIN: ${CRON_MIN:-*/20}
