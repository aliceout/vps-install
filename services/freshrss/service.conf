TYPE="docker-compose"
DESCRIPTION="FreshRSS - agregateur RSS self-hosted (image officielle, SQLite, data sur disque)"

INFISICAL_PATH="/services/freshrss"

# Data : config, feeds.db (SQLite), extensions, cache.
DATA_DIR="/home/$VPS_USER/data/freshrss"

# Restore depuis backup au moment de l'install (tu retrouves tes feeds + history
# apres reinstall VPS).
RESTORE_ON_INSTALL=yes
