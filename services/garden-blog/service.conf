TYPE="docker-compose"
DESCRIPTION="Ghost blog (garden) - image officielle, SQLite, data sur disque, SMTP"

INFISICAL_PATH="/services/garden-blog"

# Data utilisateur (themes, images, posts, ghost.db) -> backup automatique
# via /home/$VPS_USER/data/.
DATA_DIR="/home/$VPS_USER/data/garden-blog"

# Restore depuis le dernier snapshot restic au moment de l'install si dispo
# (apres reinstall VPS, les posts/themes/images reviennent automatiquement).
RESTORE_ON_INSTALL=yes
