# Immich : photo gestionnaire self-hosted, 4 services (server, ML, redis,
# postgres). Reference compose officiel : https://immich.app/docs/install/docker-compose
#
# Variables substituees depuis /var/lib/services/immich/runtime.env :
#   - SERVICE_NAME, PORT, ADDRESS   (cloud Infisical /services/immich/)
#   - DATA_DIR        racine des donnees Immich (uploads + ML cache + postgres).
#                     Auto-cale par install.sh sur /home/$VPS_USER/data/immich,
#                     pas configurable via Infisical (c'est de l'ops data).
#   - LIBRARY_PATH    bibliotheque externe en RW (photos deja organisees par
#                     dossier, mountees telles quelles dans /library)
#                     ex: /media/pi/data/cloud/Photos
#   - DB_PASSWORD     password postgres (genere une fois, stocke dans Infisical)
#   - IMMICH_VERSION  tag d'image (defaut "release", peut etre v1.x pour pin)
#   - HOST_UID, HOST_GID  UID/GID du VPS_USER host. Auto-cale par install.sh.
#                         server + ML tournent en HOST_UID -> fichiers crees
#                         appartiennent au user host, accessibles en CLI sans
#                         sudo. Postgres reste en UID 999 (interne).

services:
  server:
    container_name: ${SERVICE_NAME}-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: unless-stopped
    # Tourne en HOST_UID:HOST_GID pour que les fichiers crees dans /library et
    # /usr/src/app/upload appartiennent au user host (= VPS_USER), pas root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    healthcheck:
      disable: false
    ports:
      - "127.0.0.1:${PORT}:2283"
    volumes:
      # Uploads geres par Immich (photos uploades via l'UI, thumbs, transcodes)
      - ${DATA_DIR}/upload:/usr/src/app/upload
      # Bibliotheque externe : tes photos deja organisees, RW pour permettre
      # gestion depuis Immich (delete, rename, etc.). La corbeille Immich + le
      # backup Borg sont la safety net.
      - ${LIBRARY_PATH}:/library
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: ${SERVICE_NAME}-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: ${SERVICE_NAME}-redis
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  machine-learning:
    container_name: ${SERVICE_NAME}-ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    restart: unless-stopped
    # Meme que server : tourne en HOST_UID pour que le model-cache appartienne
    # au user host.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    healthcheck:
      disable: false
    volumes:
      - ${DATA_DIR}/model-cache:/cache
    environment:
      TZ: ${TZ:-Europe/Paris}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: ${SERVICE_NAME}-redis
    # Tag + SHA recopies depuis le compose officiel Immich
    # (https://github.com/immich-app/immich/blob/main/docker/docker-compose.yml).
    # Verifie la version recommandee dans la doc Immich lors d'un upgrade majeur.
    image: docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    container_name: ${SERVICE_NAME}-postgres
    # Immich a besoin de pgvecto-rs / vectorchord. Image officielle qui inclut
    # les extensions necessaires. Tag + SHA recopies depuis le compose officiel
    # Immich. Verifie la version recommandee dans la doc lors d'un upgrade
    # majeur (la structure du tag est : <pg_major>-vectorchord<v>-pgvectors<v>).
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=immich --username=postgres || exit 1"]
      interval: 5m
      timeout: 10s
      start_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
