server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADDRESS__.access.log;
    error_log  /var/log/nginx/__ADDRESS__.error.log;

    # Photos/videos RAW peuvent etre lourdes (50G = generique pour les uploads
    # bulk d'une migration. A baisser si tu veux limiter les abus.)
    client_max_body_size 50G;

    # Uploads et streaming long
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   60s;
    proxy_request_buffering off;
    proxy_buffering         off;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;

        # Websocket pour les notifs temps reel (uploads, upload progress, etc.)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
