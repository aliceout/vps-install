TYPE="docker-compose"
DESCRIPTION="Immich - gestionnaire photos self-hosted (server uniquement)"

INFISICAL_PATH="/services/immich"

# Pas de DATA_DIR uniforme : paths explicites dans le compose, lus depuis
# Infisical Cloud sous /services/immich/ (DATA_DIR + LIBRARY_PATH).
# DATA_DIR    : racine des donnees Immich (uploads, ML cache, postgres)
# LIBRARY_PATH: bibliotheque externe en lecture-ecriture (photos deja organisees
#               par dossier, montees telles quelles dans /library cote container)
# RESTORE_ON_INSTALL ne s'applique pas (data hors arbre /home/<user>/data/).
