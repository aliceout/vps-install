# Jellyfin (lscr.io/linuxserver/jellyfin) - media server.
# Variables substituees depuis /var/lib/services/jellyfin/runtime.env :
#   - SERVICE_NAME, PORT      (cloud Infisical /services/jellyfin/)
#   - CONFIG_DIR              (self-hosted, ex: /media/pi/media/config)
#   - MEDIA_ROOT              (self-hosted, ex: /media/pi/media/transmission/completed)
#
# Constantes hardcodees ici (pas dans Infisical) :
#   - PUID/PGID 1000 (uid pi)
#   - TZ Europe/Paris
#   - sous-dossiers media (series, films, docs, etc.) sous MEDIA_ROOT

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT}:8096"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Paris"
    volumes:
      - ${CONFIG_DIR}:/config
      - ${MEDIA_ROOT}/series:/data/tvshows
      - ${MEDIA_ROOT}/films/1900:/data/1900
      - ${MEDIA_ROOT}/films/2000:/data/2000
      - ${MEDIA_ROOT}/docs:/data/docs
      - ${MEDIA_ROOT}/series-docs:/data/series-docs
      - ${MEDIA_ROOT}/anims:/data/anims
      - ${MEDIA_ROOT}/eros:/data/eros
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
