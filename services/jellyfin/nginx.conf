server {
    server_name __ADRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADRESS__.access.log;
    error_log  /var/log/nginx/__ADRESS__.error.log;

    # Streaming video : grosses reponses, longue duree de connexion
    client_max_body_size 100M;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;

        # Websocket pour le client web Jellyfin (real-time playback)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    server_name __ADRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
