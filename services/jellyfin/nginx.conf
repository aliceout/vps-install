server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADDRESS__.access.log;
    error_log  /var/log/nginx/__ADDRESS__.error.log;

    # Streaming video : grosses reponses, longue duree de connexion
    client_max_body_size 100M;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;

        # Websocket pour le client web Jellyfin (real-time playback)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # L'app Jellyfin LG webOS charge le client dans une iframe : le
        # X-Frame-Options: SAMEORIGIN herite de security.conf la bloque
        # (erreur webOS -27 "unable to load"). Astuce nginx : des qu'on
        # (re)declare des add_header ICI, nginx cesse d'heriter ceux du niveau
        # server -> X-Frame-Options disparait pour Jellyfin. On repose donc les
        # autres headers de securite, sans X-Frame-Options.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    }
}

server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
