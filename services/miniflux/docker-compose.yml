# Miniflux - lecteur RSS Go + Postgres.
# Variables substituees depuis l'env du shell (sourced de /etc/secrets/miniflux.env
# par install.sh / hook). Bind mount Postgres sur disque host.

services:
  db:
    image: postgres:16-alpine
    container_name: ${SERVICE_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miniflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-miniflux}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniflux} -d ${POSTGRES_DB:-miniflux}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: miniflux/miniflux:latest
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-miniflux}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-miniflux}?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Refresh des feeds : default toutes les 60 min, valeur en minutes
      POLLING_FREQUENCY: ${POLLING_FREQUENCY:-60}
