server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADDRESS__.access.log;
    error_log  /var/log/nginx/__ADDRESS__.error.log;

    location / {
        # Interface d'admin AIO (mastercontainer) : le port hote __PORT__ est
        # mappe sur le 8080 du conteneur, qui parle HTTPS avec un cert
        # auto-signe -> upstream en https, sans verification du cert (c'est
        # du loopback). NE PAS confondre avec Nextcloud lui-meme (APACHE_PORT,
        # 11000, service "nextcloud").
        proxy_pass https://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;
        proxy_ssl_verify off;
    }
}

server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
