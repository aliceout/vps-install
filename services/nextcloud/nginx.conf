server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADDRESS__.access.log;
    error_log  /var/log/nginx/__ADDRESS__.error.log;

    # Nextcloud AIO : gros transferts + sync (Cryptomator = milliers de petits
    # fichiers). client_max_body_size 0 au niveau server (OK, pas pose par les
    # includes). Les timeouts agressifs herites de security.conf
    # (client_body_timeout 15s / send_timeout 30s) sont deja declares au niveau
    # server par vhost-head.conf -> on ne peut PAS les re-declarer ici (doublon
    # nginx), on les override dans la location ci-dessous. client_header_timeout
    # n'existe qu'en http/server (pas location) et 15s suffit pour des headers.
    client_max_body_size  0;          # AIO gere ses propres limites d'upload

    location / {
        # AIO expose son apache sur 127.0.0.1:__PORT__ (APACHE_PORT, defaut 11000).
        # $request_uri : recommande par la doc AIO (evite le double-encodage des
        # chemins WebDAV avec caracteres speciaux, frequents avec Cryptomator).
        proxy_pass http://127.0.0.1:__PORT__$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Websocket (notifications temps reel Nextcloud)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Override (niveau location) des timeouts client agressifs de security.conf,
        # sinon les grosses syncs Cryptomator se font couper.
        client_body_timeout     3600s;
        send_timeout            3600s;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_request_buffering off;
        proxy_buffering         off;
        client_body_buffer_size 512k;
    }
}

server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
