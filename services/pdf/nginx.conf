server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __ADRESS__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    include /etc/nginx/include/ssl.conf;
    include /etc/nginx/include/security.conf;
    include /etc/nginx/include/headers.conf;

    # Stirling bosse sur des PDFs, upload size + timeout rallonges
    client_max_body_size 200M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8097;
        include /etc/nginx/include/proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __ADRESS__;
    return 301 https://$host$request_uri;
}
