TYPE="docker-compose"
DESCRIPTION="Stirling PDF - suite locale de manipulation PDF, acces libre"

INFISICAL_PATH="/services/pdf"

# Pas de RESTORE_ON_INSTALL : Stirling n'a pas de data utilisateur persistante
# (tu uploads un PDF, tu le manipules, tu le downloads, done). Les volumes
# /var/lib/services/pdf/{configs,logs,tessdata} sont de l'operationnel
# regenerable, pas backup.
