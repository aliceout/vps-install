# Quackback - feedback platform open-source (alternative Canny / UserVoice).
# Stack : Postgres (build local + pg_cron + pgvector) + Dragonfly (Redis-compat
# pour BullMQ) + App (build local depuis ${SOURCE_DIR}).
#
# Variables substituees depuis /var/lib/services/quackback/runtime.env :
#   - SERVICE_NAME, PORT, ADDRESS, DATA_DIR, SOURCE_DIR
#       (cloud Infisical /services/quackback/ + computed)
#   - POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   - REDIS_PASSWORD
#   - SECRET_KEY
#   - EMAIL_*
#       (self-hosted Infisical /quackback/)

services:
  postgres:
    build:
      context: ${SOURCE_DIR}/docker/postgres
      dockerfile: Dockerfile
    container_name: ${SERVICE_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
      - -c
      - max_connections=200
    volumes:
      # Postgres 18+ stocke en sous-dossier versionne (/var/lib/postgresql/18/data)
      # pour permettre pg_upgrade --link. Mount = parent /var/lib/postgresql.
      - ${DATA_DIR}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    container_name: ${SERVICE_NAME}-dragonfly
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # BullMQ requires cluster_mode=emulated + lock_on_hashtags pour la compat
    # Lua scripts. cf https://www.dragonflydb.io/docs/integrations/bullmq
    command:
      - dragonfly
      - --cluster_mode=emulated
      - --lock_on_hashtags
      - --requirepass=${REDIS_PASSWORD}
    volumes:
      - ${DATA_DIR}/dragonfly:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ${SOURCE_DIR}
      dockerfile: apps/web/Dockerfile
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@dragonfly:6379
      BASE_URL: https://${ADDRESS}
      PORT: "3000"
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM}
