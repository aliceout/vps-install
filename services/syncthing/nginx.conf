server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    # Syncthing peut envoyer/recevoir des fichiers via l'UI web (drag&drop
    # de config-overrides, exports d'index, etc.). 1G suffit.
    client_max_body_size 1G;

    location / {
        # Syncthing sert son web UI en HTTPS self-signed sur 8384 (security
        # by default, pas de flag pour disable). On proxy en https avec
        # verify off : nginx termine le TLS externe avec Let's Encrypt, le
        # TLS interne self-signed est traverse en pure forwarding.
        proxy_pass https://127.0.0.1:__PORT__;
        proxy_ssl_verify off;
        include /etc/nginx/include/proxy.conf;

        # WebSocket pour les notifs temps reel de l'UI (live events,
        # progress bars, etc.).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
