server {
    server_name __ADDRESS__ www.__ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADDRESS__.access.log;
    error_log  /var/log/nginx/__ADDRESS__.error.log;

    # Uploads : podcasts audio jusqu'a 300 Mo (plafond du parseur Payload,
    # cf payload.config.ts). Doit etre >= a ce plafond, sinon nginx refuse
    # AVANT Payload avec un 413 obscur.
    client_max_body_size 300M;
    # Override du client_body_timeout global (15s dans security.conf) : un
    # upload de 300 Mo sur une connexion lente depasse largement 15s entre
    # deux lectures -> nginx couperait. On desserre pour ce vhost.
    client_body_timeout 300s;

    # Payload CMS (admin UI + API). JSON dynamique sur /cms/api/*, pas de cache.
    location /cms/ {
        proxy_pass http://127.0.0.1:__PORT_PAYLOAD__;
        include /etc/nginx/include/proxy.conf;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        # Gros uploads (audio) : on streame vers le backend au lieu de tout
        # bufferiser dans nginx, et on laisse le temps a l'upload d'aboutir.
        proxy_request_buffering off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # Site Astro SSR (Node)
    location / {
        proxy_pass http://127.0.0.1:__PORT_SITE__;
        include /etc/nginx/include/proxy.conf;
    }
}

server {
    server_name __ADDRESS__ www.__ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
