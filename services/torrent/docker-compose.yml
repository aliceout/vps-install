# Transmission via OpenVPN (haugene/transmission-openvpn) + tinyauth
# (auth form-based devant le webUI car Transmission RPC = HTTP Basic, mauvais
# avec les password managers).
#
# Variables substituees depuis /var/lib/services/torrent/runtime.env :
#   - SERVICE_NAME, PORT, AUTH_PORT, ADDRESS  (cloud Infisical /services/torrent/)
#   - DATA_DIR, OPENVPN_*                    (Cloud /services/torrent/)
#   - TINYAUTH_USERS, TINYAUTH_SECRET        (Cloud /services/torrent/)
#
# Constantes hardcodees ici (pas dans Infisical) :
#   - PUID/PGID 1000 (uid pi sur ce host)
#   - TZ Europe/Paris
#   - TRANSMISSION_WEB_UI transmission-web-control
#   - TRANSMISSION_PEER_PORT 51413 (default upstream)
#
# LOCAL_NETWORK : optionnel dans Infisical Cloud (path /services/torrent/).
# Si absent, default sur 192.168.1.0/24 (LAN typique home). Override en y
# ajoutant LOCAL_NETWORK=<cidr> (ex: 10.0.0.0/24).

services:
  transmission:
    image: haugene/transmission-openvpn:latest
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:${PORT}:9091"
    volumes:
      - ${DATA_DIR}:/data
    environment:
      OPENVPN_PROVIDER: ${OPENVPN_PROVIDER}
      OPENVPN_CONFIG: ${OPENVPN_CONFIG}
      OPENVPN_USERNAME: ${OPENVPN_USERNAME}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}

      # Kill switch : si le VPN tombe, blocage total (evite leak IP)
      DROP_DEFAULT_ROUTE: "yes"

      # Bypass VPN pour le LAN (override via LOCAL_NETWORK dans Infisical)
      LOCAL_NETWORK: "${LOCAL_NETWORK:-192.168.1.0/24}"

      # RPC : auth desactivee (gere par tinyauth en amont)
      TRANSMISSION_WEB_UI: "transmission-web-control"
      TRANSMISSION_RPC_AUTHENTICATION_REQUIRED: "false"
      # Whitelist large : la securite est cote nginx + tinyauth
      TRANSMISSION_RPC_HOST_WHITELIST: "*"
      TRANSMISSION_RPC_WHITELIST_ENABLED: "false"

      TRANSMISSION_PEER_PORT: "51413"
      LOG_TO_STDOUT: "true"
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Paris"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:latest
    container_name: ${SERVICE_NAME}-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTH_PORT}:3000"
    volumes:
      # Persistance de la SQLite tinyauth.db (cookies key auto-generee +
      # sessions). Sans, chaque restart invalide toutes les sessions.
      - ${DATA_DIR}/tinyauth:/app/data
    environment:
      # URL publique de l'app proteget (v5+ : TINYAUTH_APPURL, etait APP_URL)
      TINYAUTH_APPURL: https://${ADDRESS}

      # Liste des users : "alice:$$2a$$10$$xxxxx" (plusieurs separes par virgule)
      # Hash bcrypt genere avec :
      #   docker run --rm ghcr.io/steveiliop56/tinyauth:latest user create -u <user> -p <pass>
      TINYAUTH_AUTH_USERS: ${TINYAUTH_USERS}

      # SQLite de persistance (cookies key + sessions)
      TINYAUTH_DATABASE_PATH: /app/data/tinyauth.db

      # Cookie HTTPS-only (on est derriere nginx en HTTPS)
      TINYAUTH_AUTH_SECURECOOKIE: "true"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
