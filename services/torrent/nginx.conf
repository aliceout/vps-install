server {
    server_name __ADRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADRESS__.access.log;
    error_log  /var/log/nginx/__ADRESS__.error.log;

    # Upload de .torrent + magnet via l'UI
    client_max_body_size 50M;

    # --- tinyauth (form-based auth devant transmission) -------------------
    # Login UI : page de connexion + assets statiques
    location /login {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }
    location /logout {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    # Endpoint API tinyauth (verif cookie pour auth_request)
    location = /api/auth/nginx {
        internal;
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL  $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
    }

    # Autres routes /api/* tinyauth (login/logout API, etc.)
    location /api/ {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    # --- Transmission (UI + RPC), protegee par tinyauth -------------------
    location / {
        auth_request /api/auth/nginx;
        error_page 401 = @auth_redirect;

        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    location @auth_redirect {
        return 302 /login?redirect_uri=$scheme://$http_host$request_uri;
    }
}

server {
    server_name __ADRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
