server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    access_log /var/log/nginx/__ADDRESS__.access.log;
    error_log  /var/log/nginx/__ADDRESS__.error.log;

    # Upload de .torrent + magnet via l'UI
    client_max_body_size 50M;

    # --- tinyauth (form-based auth devant transmission) -------------------
    # Login UI : page de connexion
    location /login {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }
    location /logout {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    # Assets statiques de la page de login (JS, CSS, fonts, icones).
    # Doivent etre joignables SANS auth (sinon le browser charge de l'HTML
    # de redirection au lieu du JS et la page de login marche pas).
    location /assets/ {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    # Endpoint API tinyauth (verif cookie pour auth_request)
    location = /api/auth/nginx {
        internal;
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL  $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
    }

    # Autres routes /api/* tinyauth (login/logout API, etc.)
    location /api/ {
        proxy_pass http://127.0.0.1:__AUTH_PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    # --- Transmission RPC (apps tierces : Android, scripts) ---------------
    # Bypass intelligent :
    #  - Cookie tinyauth valide (= user web logge) -> nginx injecte un header
    #    Authorization Basic automatique avec le placeholder __rpc_basic__
    #    que install.sh remplace par base64(user:pass) apres apply_nginx.
    #    Pas de popup browser pour le user web.
    #  - Pas de cookie (Android, scripts externes) -> auth_request retourne
    #    401, on tombe sur @rpc_basic_passthrough qui forward la requete sans
    #    injection -> Transmission demande son auth Basic native.
    # Exact match -> ne capture que /transmission/rpc, pas le reste de l'UI.
    # Note : __rpc_basic__ est minuscule -> ne matche pas la regex de
    # verification d'apply_nginx (qui cherche __[A-Z]+__), donc le framework
    # le laisse intact. install.sh fait la substitution lui-meme.
    location = /transmission/rpc {
        auth_request /api/auth/nginx;
        error_page 401 = @rpc_basic_passthrough;

        proxy_set_header Authorization "Basic __rpc_basic__";
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    location @rpc_basic_passthrough {
        # Cas Android / scripts : on forward sans injecter Authorization,
        # Transmission demande son auth Basic au client.
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    # --- Transmission UI web, protegee par tinyauth -----------------------
    location / {
        auth_request /api/auth/nginx;
        error_page 401 = @auth_redirect;

        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/include/proxy.conf;
    }

    location @auth_redirect {
        return 302 /login?redirect_uri=$scheme://$http_host$request_uri;
    }
}

server {
    server_name __ADDRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
