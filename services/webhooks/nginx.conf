server {
    server_name __ADRESS__;
    include /etc/nginx/include/vhost-head.conf;
    include /etc/nginx/certificat/__DOMAIN__.conf;

    # GitHub POST parfois volumineux (release notes etc.)
    client_max_body_size 5M;

    location = /webhooks {
        limit_req zone=webhook_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8070/webhooks;
        include /etc/nginx/include/proxy.conf;
    }

    location = /webhook {
        limit_req zone=webhook_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8070/webhook;
        include /etc/nginx/include/proxy.conf;
    }

    # Tout le reste : 404 (le serveur n'a qu'un seul endpoint utile)
    location / {
        return 404;
    }
}

server {
    server_name __ADRESS__;
    include /etc/nginx/include/vhost-http-redirect.conf;
}
