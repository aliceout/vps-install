TYPE="native"
DESCRIPTION="GitHub webhooks receiver (Node.js + systemd)"

# Path scope par host_type : VPS et server peuvent tourner chacun leur
# propre receiver avec une ADRESS distincte (ex: webhooks.public.tld vs
# hooks.lan.tld). HOST_TYPE est lu depuis /etc/infisical/host-type par
# service.sh et expose dans l'env quand ce conf est source.
INFISICAL_PATH="/services/webhooks/${HOST_TYPE}"
